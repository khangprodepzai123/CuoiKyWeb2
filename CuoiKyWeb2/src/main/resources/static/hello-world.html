<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello World</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        margin: 0;
        padding: 48px 20px;
        background: #0b1220;
        color: #e6edf3;
      }
      .card {
        max-width: 720px;
        margin: 0 auto;
        padding: 28px 24px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 34px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        opacity: 0.9;
        line-height: 1.5;
      }
      code {
        background: rgba(255, 255, 255, 0.08);
        padding: 2px 6px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Hello World</h1>
      <p>
        Nếu bạn chạy Spring Boot, mở <code>/hello-world.html</code> để xem trang này.
      </p>
    </div>
  </body>
</html>
